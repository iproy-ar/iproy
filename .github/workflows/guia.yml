name: Guía PIM
on:
  push: { branches: [main] }
  pull_request:
jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  guia:
    runs-on: ubuntu-latest
    needs: secretos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Instalar SUSHI y Jekyll
        run: |
          npm install -g fsh-sushi
          sudo apt-get update && sudo apt-get install -y jekyll
      - name: Compilar FSH
        working-directory: especificacion
        run: sushi build .
      - name: Publicar guía (HL7 IG Publisher)
        working-directory: especificacion
        run: |
          curl -L -o publisher.jar https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar
          java -jar publisher.jar -ig . -tx n/a
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: especificacion/output }
  publicar:
    if: github.ref == 'refs/heads/main'
    needs: guia
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
  software:
    runs-on: ubuntu-latest
    needs: secretos
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: sodium, pdo_sqlite }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Compilar la guía y comprobar que el nodo sirve exactamente esos artefactos
        run: |
          npm install -g fsh-sushi
          bash herramientas/guia-al-nodo.sh
          git diff --exit-code -- nodo/conf/pim-guia
      - name: Pruebas unitarias (núcleo, módulos, HL7 v2 de PCD-15 y contrato servidor ↔ guía)
        run: php pruebas/unitarias.php
      - name: Licencias, cabeceras SPDX, secretos y datos institucionales
        run: php incubadora/incubar.php verificar nodo
      - name: Contrato especificación ↔ implementación sin diferencias no declaradas y al día
        run: python3 herramientas/contrato.py > /tmp/d.md && diff <(sed 1,5d /tmp/d.md) <(sed 1,5d especificacion/DIFERENCIAS_IMPLEMENTACION.md)
      - name: Contrato OpenAPI válido
        run: pip install openapi-spec-validator pyyaml && python3 -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('api/openapi_pim_v1_2_0.yaml')))"
